services:
  # ── Único servicio: FastAPI + Frontend Web ───────────────────────────────────
  # FastAPI sirve la API en /api/* y el frontend HTML/CSS/JS en /
  - type: web
    name: atena-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Se configura manualmente en el panel de Render
      - key: GROQ_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: EMBED_MODEL
        value: all-MiniLM-L6-v2
      - key: SUPABASE_DB_URL
        sync: false          # Se configura manualmente en el panel de Render
      - key: ADMIN_PIN
        sync: false          # Se configura manualmente en el panel de Render
